[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speaker"
version = "0.1.0"
description = "Cognitive autonomous agent"
requires-python = ">=3.12"
dependencies = [
    "osma>=0.1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/speaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
